<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Geotagging Camera - Excellent Kencana</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .mirror-mode {
      transform: scaleX(-1);
    }
    .multi-line-address {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* --- PENGATURAN POSISI & ROTASI UI LIVE VIEW --- */

    /* 1. Mode Portrait (Default) */
    .mode-portrait #liveControlsContainer {
      top: 12px;
      right: 12px;
      left: auto;
    }
    .mode-portrait #liveLogoContainer {
      top: 12px;
      left: 12px;
      bottom: auto;
      transform: none;
    }
    .mode-portrait #liveOverlayBox {
      bottom: 12px;
      left: 12px;
      right: 12px;
      top: auto;
      width: auto;
      transform: none;
    }

    /* 2. Mode Landscape */
    .mode-landscape #liveControlsContainer {
      top: 12px;
      left: 12px;
      right: auto;
    }
    .mode-landscape #liveLogoContainer {
      bottom: 45px;
      left: 45px;
      top: auto;
      transform: rotate(-90deg);
      transform-origin: bottom left;
    }
    .mode-landscape #liveOverlayBox {
      bottom: 350px;
      right: 45px;
      left: auto;
      top: auto;
      width: 290px;
      transform: rotate(-90deg);
      transform-origin: bottom right;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-3 font-sans">

  <!-- Header -->
  <header class="w-full max-w-md text-center py-1">
    <h1 class="text-base font-bold text-amber-400">📍 Live GPS Map Camera</h1>
    <p class="text-[11px] text-slate-400">Excellent Kencana - Anti-Fake GPS System</p>
  </header>

  <!-- Main Content Box -->
  <main class="w-full max-w-md bg-slate-900 rounded-2xl shadow-2xl p-3 border border-slate-800 flex flex-col items-center">

    <!-- 1. Kotak Loading / Validasi GPS -->
    <div id="gpsVerificationBox" class="w-full text-center py-12">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-amber-400 mx-auto mb-4"></div>
      <p id="txtUserGps" class="text-sm font-semibold text-slate-200">Memulai pemindaian GPS...</p>
      <p class="text-xs text-slate-500 mt-2">Memverifikasi keaslian lokasi (2 Sampel Minimal).</p>
    </div>

    <!-- 2. Kotak Kamera Live & Watermark Overlay -->
    <div id="liveCameraContainer" class="w-full hidden flex flex-col items-center relative">
      <!-- cameraViewWrapper memiliki event onclick untuk Fokus Kamera -->
      <div id="cameraViewWrapper" onclick="triggerAutoFocus()" class="w-full rounded-xl overflow-hidden shadow-lg border border-slate-700 bg-black relative mode-portrait cursor-pointer">
        
        <!-- Elemen Video Live -->
        <video id="videoElement" autoplay playsinline muted class="w-full h-[78vh] max-h-[820px] object-cover"></video>
        
        <!-- Tombol Kontrol -->
        <div id="liveControlsContainer" onclick="event.stopPropagation()" class="absolute flex gap-2 z-20 transition-all duration-300">
          <button onclick="switchCamera()" class="bg-slate-900/85 hover:bg-slate-800 text-amber-400 p-2.5 rounded-full shadow-lg backdrop-blur-md border border-slate-700 flex items-center justify-center" title="Ganti Kamera">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          </button>
          <button onclick="toggleOrientationMode()" class="bg-slate-900/85 hover:bg-slate-800 text-amber-400 p-2.5 rounded-full shadow-lg backdrop-blur-md border border-slate-700 flex items-center justify-center" title="Ubah Posisi Layout">
            <svg id="orientationIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
            </svg>
          </button>
        </div>

        <!-- Live Watermark Overlay -->
        <div id="liveOverlayBox" class="absolute bg-black/85 backdrop-blur-sm p-2.5 rounded-xl border border-white/15 text-white pointer-events-none z-10 flex gap-2.5 items-center transition-all duration-300 shadow-xl">
          <img id="liveMapImg" src="" alt="Map" class="w-16 h-16 rounded-lg object-cover border border-white/30 shrink-0 hidden">
          <div class="flex-1 min-w-0">
            <div class="text-amber-400 font-bold text-[10px] mb-0.5">📍 GPS MAP Camera</div>
            <div id="liveAddress" class="text-[8.5px] text-slate-200 leading-tight mb-1 multi-line-address">Memuat alamat lokasi...</div>
            <div id="liveLatLon" class="text-[9px] text-sky-400 font-mono">Lat: 0.00000, Lon: 0.00000</div>
            <div id="liveDateTime" class="text-[8px] text-slate-300 mt-0.5">---</div>
          </div>
        </div>

        <!-- Logo Container -->
        <div id="liveLogoContainer" class="absolute pointer-events-none z-10 transition-all duration-300">
          <img id="liveLogoImg" src="logo.png" alt="Logo" class="h-10 w-auto drop-shadow-md filter brightness-[1.5]">
        </div>

      </div>

      <!-- Tombol Ambil Gambar -->
      <button onclick="captureLivePhoto()" class="w-full mt-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 px-6 rounded-xl shadow-lg flex items-center justify-center gap-2 transition duration-200 text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        Ambil Gambar
      </button>
    </div>

    <!-- 3. Kotak Preview Hasil Foto -->
    <div id="previewContainer" class="w-full hidden flex flex-col items-center">
      <div class="w-full rounded-xl overflow-hidden shadow-lg border border-slate-700 mb-3 bg-slate-950">
        <img id="geotagPreviewImg" src="" alt="Preview Geotag" class="w-full object-contain">
      </div>

      <!-- Tombol Aksi -->
      <div class="flex w-full gap-3">
        <button onclick="retakePhoto()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-2.5 rounded-xl transition duration-200 text-sm border border-slate-700">
          🔄 Ambil Ulang
        </button>
        <a id="downloadBtn" download="Geotag_Photo.jpg" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-xl text-center transition duration-200 text-sm flex items-center justify-center gap-1 shadow-lg">
          💾 Download Foto
        </a>
      </div>
    </div>

    <!-- Canvas Tersembunyi -->
    <canvas id="cameraCanvas" class="hidden"></canvas>

  </main>

  <!-- Footer -->
  <footer class="w-full text-center py-1 text-[11px] text-slate-500">
    &copy; 2026 Excellent Kencana. All rights reserved.
  </footer>

  <!-- Script Logika Aplikasi -->
  <script>
    let currentUserGps = { lat: 0, lon: 0 };
    let resolvedAddressText = "Memuat alamat lokasi...";
    let mapDataUrl = "";
    let finalWatermarkedDataUrl = "";
    let mediaStream = null;
    let videoTrack = null;
    let serverTimeOffset = 0;
    let currentFacingMode = 'environment';
    let layoutOrientation = 'portrait';
    const LOGO_URL = "logo.png"; 

    document.addEventListener("DOMContentLoaded", async function() {
      await syncServerTime();
      startGpsVerificationProcess();
    });

    async function syncServerTime() {
      try {
        const startClientTime = new Date().getTime();
        const response = await fetch(window.location.href, { method: 'HEAD' });
        const serverDateStr = response.headers.get('Date');
        if (serverDateStr) {
          const serverTime = new Date(serverDateStr).getTime();
          const endClientTime = new Date().getTime();
          const latency = (endClientTime - startClientTime) / 2;
          serverTimeOffset = serverTime - endClientTime + latency;
        }
      } catch (e) {
        console.warn("Gagal sinkronisasi waktu server, menggunakan waktu lokal.");
      }
    }

    function getRealTime() {
      return new Date(new Date().getTime() + serverTimeOffset);
    }

    function toggleOrientationMode() {
      layoutOrientation = layoutOrientation === 'portrait' ? 'landscape' : 'portrait';
      const cameraWrapper = document.getElementById('cameraViewWrapper');
      const icon = document.getElementById('orientationIcon');

      if (layoutOrientation === 'landscape') {
        cameraWrapper.classList.remove('mode-portrait');
        cameraWrapper.classList.add('mode-landscape');
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />';
        Swal.fire({ toast: true, position: 'top', icon: 'info', title: 'Mode Landscape Aktif', showConfirmButton: false, timer: 1500 });
      } else {
        cameraWrapper.classList.remove('mode-landscape');
        cameraWrapper.classList.add('mode-portrait');
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />';
        Swal.fire({ toast: true, position: 'top', icon: 'info', title: 'Mode Portrait Aktif', showConfirmButton: false, timer: 1500 });
      }
    }

    function startGpsVerificationProcess() {
      if (!navigator.geolocation) {
        document.getElementById('txtUserGps').innerText = "GPS Tidak Didukung oleh Browser Anda.";
        Swal.fire({ icon: 'error', title: 'Tidak Didukung', text: 'Browser Anda tidak mendukung fitur GPS.' });
        return;
      }

      const maxSamples = 2;
      let gpsSamples = [];
      let currentSampleIndex = 0;

      function fetchSingleGps() {
        if (currentSampleIndex >= maxSamples) {
          validateAndProcessGpsSamples(gpsSamples);
          return;
        }

        document.getElementById('txtUserGps').innerText = `Memindai GPS (${currentSampleIndex + 1}/${maxSamples})...`;

        navigator.geolocation.getCurrentPosition(
          pos => {
            gpsSamples.push({
              lat: pos.coords.latitude,
              lon: pos.coords.longitude,
              accuracy: pos.coords.accuracy
            });
            currentSampleIndex++;
            if (currentSampleIndex < maxSamples) {
              setTimeout(fetchSingleGps, 2000);
            } else {
              fetchSingleGps();
            }
          },
          err => {
            let errorMsg = "Gagal Akses GPS";
            if (err.code === 1) errorMsg = "Izin GPS Ditolak oleh Pengguna";
            else if (err.code === 2) errorMsg = "Sinyal GPS Hilang";
            else if (err.code === 3) errorMsg = "Waktu GPS Habis (Timeout)";
            
            document.getElementById('txtUserGps').innerText = errorMsg;
            Swal.fire({ icon: 'error', title: 'Gagal GPS', text: errorMsg });
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 }
        );
      }
      fetchSingleGps();
    }

    function validateAndProcessGpsSamples(gpsSamples) {
      if (!gpsSamples || gpsSamples.length === 0) {
        document.getElementById('txtUserGps').innerText = "Gagal mendapatkan data GPS.";
        return;
      }

      const latestSample = gpsSamples[gpsSamples.length - 1];

      if (!latestSample.lat || !latestSample.lon || (latestSample.lat === 0 && latestSample.lon === 0)) {
        document.getElementById('txtUserGps').innerText = "Koordinat GPS tidak valid.";
        return;
      }

      let isCompletelyFrozen = true;
      let isAccuracyFrozen = true;
      let isIntegerAccuracy = gpsSamples.every(s => Number.isInteger(s.accuracy));

      for (let i = 1; i < gpsSamples.length; i++) {
        if (gpsSamples[i].lat !== gpsSamples[0].lat || gpsSamples[i].lon !== gpsSamples[0].lon) {
          isCompletelyFrozen = false;
        }
        if (gpsSamples[i].accuracy !== gpsSamples[0].accuracy) {
          isAccuracyFrozen = false;
        }
      }

      if (isCompletelyFrozen || (isAccuracyFrozen && isIntegerAccuracy)) {
        document.getElementById('txtUserGps').innerText = "Terdeteksi Fake GPS / Lokasi Palsu!";
        Swal.fire({
          icon: 'error',
          title: 'Akses Ditolak!',
          text: 'Sistem mendeteksi penggunaan titik koordinat palsu / Fake GPS. Harap matikan aplikasi tiruan lokasi.',
          allowOutsideClick: false
        });
        return;
      }

      currentUserGps = { lat: latestSample.lat, lon: latestSample.lon };

      generateSatelliteMapDataUrl(latestSample.lat, latestSample.lon).then(dataUrl => {
        mapDataUrl = dataUrl;
        const mapEl = document.getElementById('liveMapImg');
        if (mapEl && mapDataUrl) {
          mapEl.src = mapDataUrl;
          mapEl.classList.remove('hidden');
        }
      });

      fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latestSample.lat}&lon=${latestSample.lon}`)
        .then(res => res.json())
        .then(data => {
          resolvedAddressText = data && data.display_name ? data.display_name : `Lat: ${latestSample.lat.toFixed(5)}, Lon: ${latestSample.lon.toFixed(5)}`;
          updateLiveOverlayText();
        })
        .catch(() => {
          resolvedAddressText = `Lat: ${latestSample.lat.toFixed(5)}, Lon: ${latestSample.lon.toFixed(5)}`;
          updateLiveOverlayText();
        });

      document.getElementById('gpsVerificationBox').classList.add('hidden');
      document.getElementById('liveCameraContainer').classList.remove('hidden');
      startLiveCameraStream();
    }

    async function generateSatelliteMapDataUrl(lat, lon) {
      return new Promise((resolve) => {
        const zoom = 16;
        const n = Math.pow(2, zoom);
        const x = (lon + 180) / 360 * n;
        const y = (1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n;
        
        const tileX = Math.floor(x);
        const tileY = Math.floor(y);
        
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${zoom}/${tileY}/${tileX}`;
        
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 180;
          canvas.height = 180;
          const ctx = canvas.getContext('2d');
          
          const offsetX = (x - tileX) * 256;
          const offsetY = (y - tileY) * 256;
          
          ctx.drawImage(img, offsetX - 90, offsetY - 90, 180, 180, 0, 0, 180, 180);
          
          ctx.fillStyle = "#FFFFFF";
          ctx.font = "bold 13px sans-serif";
          ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
          ctx.shadowBlur = 4;
          ctx.fillText("Google", 8, 170);
          ctx.shadowBlur = 0;

          ctx.fillStyle = "#EF4444";
          ctx.beginPath();
          ctx.arc(90, 90, 7, 0, 2 * Math.PI);
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = "#FFFFFF";
          ctx.stroke();
          
          resolve(canvas.toDataURL('image/png'));
        };
        
        img.onerror = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 180;
          canvas.height = 180;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = "#1e293b";
          ctx.fillRect(0, 0, 180, 180);
          ctx.fillStyle = "#ffffff";
          ctx.font = "12px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("Peta Satelit", 90, 90);
          resolve(canvas.toDataURL('image/png'));
        };
      });
    }

    function updateLiveOverlayText() {
      const now = getRealTime();
      const tanggalStr = now.toLocaleDateString('id-ID', { timeZone: 'Asia/Jakarta', weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) + " " + now.toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta', hour12: false }) + " GMT +07:00";
      
      document.getElementById('liveAddress').innerText = resolvedAddressText;
      document.getElementById('liveLatLon').innerText = `Lat ${currentUserGps.lat.toFixed(6)} Long ${currentUserGps.lon.toFixed(6)}`;
      document.getElementById('liveDateTime').innerText = tanggalStr;
    }

    async function startLiveCameraStream() {
      try {
        if (mediaStream) {
          mediaStream.getTracks().forEach(track => track.stop());
        }

        const constraints = {
          video: {
            facingMode: { ideal: currentFacingMode },
            width: { ideal: 1280 },
            height: { ideal: 720 },
            focusMode: { ideal: "continuous" } // Mengaktifkan Auto Focus Kontinu jika didukung
          },
          audio: false
        };

        mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
        videoTrack = mediaStream.getVideoTracks()[0];
        const videoElement = document.getElementById('videoElement');
        videoElement.srcObject = mediaStream;
        
        if (currentFacingMode === 'user') {
          videoElement.classList.add('mirror-mode');
        } else {
          videoElement.classList.remove('mirror-mode');
        }
        
        setInterval(updateLiveOverlayText, 1000);
      } catch (err) {
        console.error("Gagal membuka kamera:", err);
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          videoTrack = mediaStream.getVideoTracks()[0];
          document.getElementById('videoElement').srcObject = mediaStream;
        } catch (e2) {
          Swal.fire({
            icon: 'error',
            title: 'Gagal Akses Kamera',
            text: 'Pastikan Anda memberikan izin akses kamera pada browser.'
          });
        }
      }
    }

    // FUNGSIONALITAS TAP TO FOCUS (FOKUS SAAT LAYAR DIKLIK)
    async function triggerAutoFocus() {
      if (!videoTrack) return;

      try {
        const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        
        if (capabilities.focusMode && capabilities.focusMode.includes('single-shot')) {
          // Paksa memicu siklus fokus sekali
          await videoTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
          // Kembalikan ke otomatis setelah 1.5 detik
          setTimeout(() => {
            videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(()=>{});
          }, 1500);
        } else if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
          await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
        }
        
        // Notifikasi Toast kecil bahwa fokus dipicu
        Swal.fire({
          toast: true,
          position: 'top',
          icon: 'success',
          title: '🎯 Memfokuskan Kamera...',
          showConfirmButton: false,
          timer: 1000
        });
      } catch (err) {
        console.log("Tap-to-focus tidak didukung secara langsung oleh perangkat/browser ini:", err);
      }
    }

    function switchCamera() {
      currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      startLiveCameraStream();
    }

    function captureLivePhoto() {
      const videoElement = document.getElementById('videoElement');
      const canvas = document.getElementById('cameraCanvas');
      if (!videoElement || !canvas) return;

      const vWidth = videoElement.videoWidth;
      const vHeight = videoElement.videoHeight;
      const cWidth = videoElement.clientWidth;
      const cHeight = videoElement.clientHeight;

      const vRatio = vWidth / vHeight;
      const cRatio = cWidth / cHeight;

      let sWidth, sHeight, sx, sy;
      if (vRatio > cRatio) {
        sHeight = vHeight;
        sWidth = vHeight * cRatio;
        sx = (vWidth - sWidth) / 2;
        sy = 0;
      } else {
        sWidth = vWidth;
        sHeight = vWidth / cRatio;
        sx = 0;
        sy = (vHeight - sHeight) / 2;
      }

      // Ukuran Canvas Standar Asli
      const targetWidth = 1000;
      const targetHeight = Math.round(targetWidth / cRatio);

      canvas.width = targetWidth;
      canvas.height = targetHeight;
      const ctx = canvas.getContext('2d');

      if (currentFacingMode === 'user') {
        ctx.save();
        ctx.scale(-1, 1);
        ctx.drawImage(videoElement, sx, sy, sWidth, sHeight, -targetWidth, 0, targetWidth, targetHeight);
        ctx.restore();
      } else {
        ctx.drawImage(videoElement, sx, sy, sWidth, sHeight, 0, 0, targetWidth, targetHeight);
      }

      const scale = targetWidth / 420;

      if (LOGO_URL) {
        const logoImg = new Image();
        logoImg.crossOrigin = "anonymous";
        logoImg.onload = () => {
          const logoPadding = Math.round(5 * scale); 
          const logoHeight = Math.round(40 * scale);
          const logoWidth = Math.round(logoHeight * (logoImg.width / logoImg.height));
          
          ctx.save();
          if (layoutOrientation === 'landscape') {
            let logoX = Math.round(20 * scale);
            let logoY = canvas.height - Math.round(35 * scale);
            ctx.translate(logoX, logoY);
            ctx.rotate(-Math.PI / 2);

            const bgWidth = logoWidth + (2 * logoPadding);
            const bgHeight = logoHeight + (2 * logoPadding);
            
            ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
            if (typeof ctx.roundRect === 'function') {
              ctx.beginPath();
              ctx.roundRect(0, 0, bgWidth, bgHeight, Math.round(8 * scale));
              ctx.fill();
            } else {
              ctx.fillRect(0, 0, bgWidth, bgHeight);
            }
            ctx.drawImage(logoImg, logoPadding, logoPadding, logoWidth, logoHeight);
          } else {
            let logoX = Math.round(15 * scale);
            let logoY = Math.round(15 * scale);
            const bgWidth = logoWidth + (2 * logoPadding);
            const bgHeight = logoHeight + (2 * logoPadding);

            ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
            if (typeof ctx.roundRect === 'function') {
              ctx.beginPath();
              ctx.roundRect(logoX - logoPadding, logoY - logoPadding, bgWidth, bgHeight, Math.round(8 * scale));
              ctx.fill();
            } else {
              ctx.fillRect(logoX - logoPadding, logoY - logoPadding, bgWidth, bgHeight);
            }
            ctx.drawImage(logoImg, logoX, logoY, logoWidth, logoHeight);
          }
          ctx.restore();

          loadMapAndRenderWatermark(canvas, scale);
        };
        logoImg.onerror = () => {
          loadMapAndRenderWatermark(canvas, scale);
        };
        logoImg.src = LOGO_URL;
      } else {
        loadMapAndRenderWatermark(canvas, scale);
      }
    }

    function loadMapAndRenderWatermark(canvas, scale) {
      const ctx = canvas.getContext('2d');
      const width = canvas.width;

      if (layoutOrientation === 'landscape') {
        const boxWidth = Math.round(320 * scale);
        const boxHeight = Math.round(135 * scale);
        
        ctx.save();
        const transX = width - Math.round(90 * scale);
        const transY = canvas.height - Math.round(90 * scale);
        ctx.translate(transX, transY);
        ctx.rotate(-Math.PI / 2);

        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        if (typeof ctx.roundRect === 'function') {
          ctx.beginPath();
          ctx.roundRect(0, 0, boxWidth, boxHeight, Math.round(12 * scale));
          ctx.fill();
        } else {
          ctx.fillRect(0, 0, boxWidth, boxHeight);
        }

        if (mapDataUrl) {
          const mapImg = new Image();
          mapImg.onload = () => {
            const mapSize = Math.round(110 * scale);
            const mapX = Math.round(12 * scale);
            const mapY = Math.round(12 * scale);

            ctx.save();
            ctx.beginPath();
            if (typeof ctx.roundRect === 'function') ctx.roundRect(mapX, mapY, mapSize, mapSize, Math.round(8 * scale));
            ctx.clip();
            ctx.drawImage(mapImg, mapX, mapY, mapSize, mapSize);
            ctx.restore();

            ctx.strokeStyle = "#FFFFFF";
            ctx.lineWidth = 1.5;
            if (typeof ctx.roundRect === 'function') {
              ctx.beginPath(); ctx.roundRect(mapX, mapY, mapSize, mapSize, Math.round(8 * scale)); ctx.stroke();
            } else {
              ctx.strokeRect(mapX, mapY, mapSize, mapSize);
            }

            drawRotatedWatermarkText(ctx, 0, 0, boxWidth, scale, mapSize + Math.round(24 * scale));
            ctx.restore();
          };
          mapImg.src = mapDataUrl;
        } else {
          drawRotatedWatermarkText(ctx, 0, 0, boxWidth, scale, Math.round(15 * scale));
          ctx.restore();
        }

      } else {
        const boxHeight = Math.round(135 * scale);
        const boxY = canvas.height - boxHeight - Math.round(15 * scale);
        const boxX = Math.round(15 * scale);
        const boxWidth = width - Math.round(30 * scale);

        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        if (typeof ctx.roundRect === 'function') {
          ctx.beginPath();
          ctx.roundRect(boxX, boxY, boxWidth, boxHeight, Math.round(12 * scale));
          ctx.fill();
        } else {
          ctx.fillRect(boxX, boxY, boxWidth, boxHeight);
        }

        if (mapDataUrl) {
          const mapImg = new Image();
          mapImg.onload = () => {
            const mapSize = Math.round(110 * scale);
            const mapX = boxX + Math.round(12 * scale);
            const mapY = boxY + Math.round(12 * scale);

            ctx.save();
            ctx.beginPath();
            if (typeof ctx.roundRect === 'function') ctx.roundRect(mapX, mapY, mapSize, mapSize, Math.round(8 * scale));
            ctx.clip();
            ctx.drawImage(mapImg, mapX, mapY, mapSize, mapSize);
            ctx.restore();

            ctx.strokeStyle = "#FFFFFF";
            ctx.lineWidth = 1.5;
            if (typeof ctx.roundRect === 'function') {
              ctx.beginPath(); ctx.roundRect(mapX, mapY, mapSize, mapSize, Math.round(8 * scale)); ctx.stroke();
            } else {
              ctx.strokeRect(mapX, mapY, mapSize, mapSize);
            }

            drawWatermarkText(ctx, boxX, boxY, boxWidth, scale, mapSize + Math.round(24 * scale));
          };
          mapImg.src = mapDataUrl;
        } else {
          drawWatermarkText(ctx, boxX, boxY, boxWidth, scale, Math.round(15 * scale));
        }
      }
    }

    function drawRotatedWatermarkText(ctx, boxX, boxY, boxWidth, scale, textOffsetX) {
      const contentX = boxX + textOffsetX;
      const maxTextWidth = boxWidth - textOffsetX - Math.round(12 * scale);
      
      ctx.fillStyle = "#F59E0B";
      ctx.font = "bold " + Math.round(11 * scale) + "px sans-serif";
      ctx.fillText("📍 GPS MAP Camera Excellent Kencana", contentX, boxY + Math.round(22 * scale));

      ctx.fillStyle = "#FFFFFF";
      ctx.font = Math.round(9.5 * scale) + "px sans-serif";
      wrapTextThreeLines(ctx, resolvedAddressText, contentX, boxY + Math.round(38 * scale), maxTextWidth, Math.round(13 * scale));

      ctx.fillStyle = "#38BDF8";
      ctx.font = "bold " + Math.round(10 * scale) + "px monospace";
      ctx.fillText(`Lat ${currentUserGps.lat.toFixed(6)} Long ${currentUserGps.lon.toFixed(6)}`, contentX, boxY + Math.round(95 * scale));

      const now = getRealTime();
      const tanggalStr = now.toLocaleDateString('id-ID', { timeZone: 'Asia/Jakarta', weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) + " " + now.toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta', hour12: false }) + " GMT +07:00";
      
      ctx.fillStyle = "#CBD5E1";
      ctx.font = Math.round(9 * scale) + "px sans-serif";
      ctx.fillText(tanggalStr, contentX, boxY + Math.round(115 * scale));

      finalizeCanvasImage();
    }

    function drawWatermarkText(ctx, boxX, boxY, boxWidth, scale, textOffsetX) {
      const contentX = boxX + textOffsetX;
      const maxTextWidth = boxWidth - textOffsetX - Math.round(12 * scale);
      
      ctx.fillStyle = "#F59E0B";
      ctx.font = "bold " + Math.round(11 * scale) + "px sans-serif";
      ctx.fillText("📍 GPS MAP Camera Excellent Kencana", contentX, boxY + Math.round(22 * scale));

      ctx.fillStyle = "#FFFFFF";
      ctx.font = Math.round(9.5 * scale) + "px sans-serif";
      wrapTextThreeLines(ctx, resolvedAddressText, contentX, boxY + Math.round(38 * scale), maxTextWidth, Math.round(13 * scale));

      ctx.fillStyle = "#38BDF8";
      ctx.font = "bold " + Math.round(10 * scale) + "px monospace";
      ctx.fillText(`Lat ${currentUserGps.lat.toFixed(6)} Long ${currentUserGps.lon.toFixed(6)}`, contentX, boxY + Math.round(95 * scale));

      const now = getRealTime();
      const tanggalStr = now.toLocaleDateString('id-ID', { timeZone: 'Asia/Jakarta', weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) + " " + now.toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta', hour12: false }) + " GMT +07:00";
      
      ctx.fillStyle = "#CBD5E1";
      ctx.font = Math.round(9 * scale) + "px sans-serif";
      ctx.fillText(tanggalStr, contentX, boxY + Math.round(115 * scale));

      finalizeCanvasImage();
    }

    function wrapTextThreeLines(context, text, x, y, maxWidth, lineHeight) {
      if (!text) return;
      const words = text.split(' ');
      let line = '';
      let currentY = y;
      let lineCount = 1;

      for(let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = context.measureText(testLine);
        let testWidth = metrics.width;
        if (testWidth > maxWidth && n > 0) {
          if (lineCount < 3) {
            context.fillText(line, x, currentY);
            line = words[n] + ' ';
            currentY += lineHeight;
            lineCount++;
          } else {
            line = line.trim() + '...';
            break;
          }
        } else {
          line = testLine;
        }
      }
      context.fillText(line.trim(), x, currentY);
    }

    function finalizeCanvasImage() {
      const canvas = document.getElementById('cameraCanvas');
      finalWatermarkedDataUrl = canvas.toDataURL('image/jpeg', 0.9);

      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }

      document.getElementById('geotagPreviewImg').src = finalWatermarkedDataUrl;
      document.getElementById('downloadBtn').href = finalWatermarkedDataUrl;

      document.getElementById('liveCameraContainer').classList.add('hidden');
      document.getElementById('previewContainer').classList.remove('hidden');
    }

    function retakePhoto() {
      document.getElementById('previewContainer').classList.add('hidden');
      document.getElementById('liveCameraContainer').classList.remove('hidden');
      startLiveCameraStream();
    }
  </script>
</body>
